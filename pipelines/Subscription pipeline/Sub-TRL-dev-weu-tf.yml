name: Dev Environment Deployment

trigger:
  branches:
    include:
    - main
  paths:
    include:
    - Modules/*
    - workspaces/spokes/dev/*

pr: none

variables:
- group: trl-hubspoke-config
- group: trl-hubspoke-secrets

stages:
- stage: Plan_Dev
  displayName: 'Plan Dev'
  jobs:
  - job: Plan
    displayName: 'Terraform Plan for Dev'
    pool:
      name: $(agentPoolName)
    steps:
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    - task: TerraformCLI@0
      displayName: 'Terraform Init'
      inputs:
        command: init
        workingDirectory: '$(devWorkspacePath)'
        environmentServiceName: '$(devServiceConnection)'
        backendType: azurerm
        backendServiceArm: '$(devServiceConnection)'
        ensureBackend: true
        backendConfig: |
          storage_account_name=$(backendStorageAccountName)
          container_name=$(backendContainerName)
          key=$(devBackendKey)
          subscription_id=$(SUBSCRIPTION_ID_DEV)
          resource_group_name=$(backendResourceGroupName)

    - task: TerraformCLI@0
      displayName: 'Terraform Plan'
      inputs:
        command: plan
        workingDirectory: '$(devWorkspacePath)'
        environmentServiceName: '$(devServiceConnection)'
        commandOptions: '-var="sql_admin_password=$(SQL_ADMIN_PASSWORD)" -var="vm_admin_password=$(VM_ADMIN_PASSWORD)"'

- stage: Apply_Dev
  displayName: 'Apply Dev'
  dependsOn: Plan_Dev
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: Apply
    displayName: 'Terraform Apply for Dev'
    pool:
      name: $(agentPoolName)
    steps:
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    - task: TerraformCLI@0
      displayName: 'Terraform Init'
      inputs:
        command: init
        workingDirectory: '$(devWorkspacePath)'
        environmentServiceName: '$(devServiceConnection)'
        backendType: azurerm
        backendServiceArm: '$(devServiceConnection)'
        ensureBackend: true
        backendConfig: |
          storage_account_name=$(backendStorageAccountName)
          container_name=$(backendContainerName)
          key=$(devBackendKey)
          subscription_id=$(SUBSCRIPTION_ID_DEV)
          resource_group_name=$(backendResourceGroupName)

    - task: TerraformCLI@0
      displayName: 'Terraform Apply'
      inputs:
        command: apply
        workingDirectory: '$(devWorkspacePath)'
        environmentServiceName: '$(devServiceConnection)'
        commandOptions: '-auto-approve -var="sql_admin_password=$(SQL_ADMIN_PASSWORD)" -var="vm_admin_password=$(VM_ADMIN_PASSWORD)"'