# Sub-TRL-hub-weu-tf.yml
name: Hub Environment Deployment

trigger: none

pr: none

variables:
- group: trl-hubspoke-config
- group: trl-hubspoke-secrets

stages:
- stage: Plan_Hub
  displayName: 'Plan Hub'
  jobs:
  - job: Plan
    displayName: 'Terraform Plan for Hub'
    pool:
      name: TRL-Agents
    steps:
    - checkout: self
      displayName: 'Checkout Repository'

    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: '$(hubServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Initializing Hub workspace..."
          Set-Location '$(hubWorkspacePath)'
          
          # Get storage account key
          $STORAGE_KEY = az storage account keys list --resource-group $(backendResourceGroupName) --account-name $(backendStorageAccountName) --query '[0].value' -o tsv
          
          # Initialize Terraform with backend configuration
          terraform init `
            -backend-config="resource_group_name=$(backendResourceGroupName)" `
            -backend-config="storage_account_name=$(backendStorageAccountName)" `
            -backend-config="container_name=$(backendContainerName)" `
            -backend-config="key=$(hubBackendKey)" `
            -backend-config="access_key=$STORAGE_KEY" `
            -reconfigure
          
          Write-Host "Hub workspace initialized successfully"

    - task: AzureCLI@2
      displayName: 'Terraform Validate'
      inputs:
        azureSubscription: '$(hubServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Validating Terraform configuration..."
          Set-Location '$(hubWorkspacePath)'
          terraform validate
          Write-Host "Terraform configuration validated successfully"

    - task: AzureCLI@2
      displayName: 'Check and Release State Lock'
      inputs:
        azureSubscription: '$(hubServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Checking for state lock in Azure Storage..."
          
          # Get storage account key for authentication
          $STORAGE_KEY = az storage account keys list `
            --resource-group $(backendResourceGroupName) `
            --account-name $(backendStorageAccountName) `
            --query '[0].value' `
            -o tsv
          
          if (-not $STORAGE_KEY) {
            Write-Host "##[warning]Could not retrieve storage account key. Skipping lock check."
            exit 0
          }
          
          # Check if the state file blob has a lease (lock)
          $blobLease = az storage blob show `
            --account-name $(backendStorageAccountName) `
            --container-name $(backendContainerName) `
            --name $(hubBackendKey) `
            --account-key $STORAGE_KEY `
            --query 'properties.lease.status' `
            -o tsv 2>$null
          
          if ($blobLease -eq "locked") {
            Write-Host "##[warning]State file is locked in Azure Storage"
            Write-Host "Attempting to break the lease..."
            
            az storage blob lease break `
              --account-name $(backendStorageAccountName) `
              --container-name $(backendContainerName) `
              --blob-name $(hubBackendKey) `
              --account-key $STORAGE_KEY `
              --lease-break-period 0
            
            Write-Host "##[section]State lock lease broken successfully"
            Start-Sleep -Seconds 2
          } elseif ($blobLease -eq "unlocked") {
            Write-Host "No state lock detected. Proceeding..."
          } else {
            Write-Host "State file not found or unable to check lease status (this is normal for first run)"
          }
      continueOnError: true
      timeoutInMinutes: 1

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: '$(hubServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Creating Terraform plan..."
          Set-Location '$(hubWorkspacePath)'
          
          # Get subscription ID from Azure CLI context
          $SUBSCRIPTION_ID = az account show --query id -o tsv
          Write-Host "Using subscription: $SUBSCRIPTION_ID"
          
          terraform plan `
            -var="sql_admin_password=$(SQL_ADMIN_PASSWORD)" `
            -var="vm_admin_password=$(VM_ADMIN_PASSWORD)" `
            -var="admin_password=$(VM_ADMIN_PASSWORD)" `
            -var="backendResourceGroupName=$(backendResourceGroupName)" `
            -var="backendStorageAccountName=$(backendStorageAccountName)" `
            -var="backendContainerName=$(backendContainerName)" `
            -var="subscription_id=$SUBSCRIPTION_ID" `
            -out=tfplan
          
          Write-Host "Terraform plan created successfully"
          Write-Host "##[section]Review the plan above before approving deployment"

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan Artifact'
      inputs:
        targetPath: '$(hubWorkspacePath)/tfplan'
        artifact: 'terraform-plan-hub'
        publishLocation: 'pipeline'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Directory'
      inputs:
        targetPath: '$(hubWorkspacePath)/.terraform'
        artifact: 'terraform-providers-hub'
        publishLocation: 'pipeline'

- stage: Apply_Hub
  displayName: 'Apply Hub (Manual Approval Required)'
  dependsOn: Plan_Hub
  condition: succeeded()
  jobs:
  - deployment: ApplyHub
    displayName: 'Terraform Apply for Hub'
    environment: 'Hub'  # This requires manual approval in Azure DevOps
    pool:
      name: TRL-Agents
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: 'Checkout Repository'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              artifact: 'terraform-plan-hub'
              path: '$(hubWorkspacePath)'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Providers'
            inputs:
              artifact: 'terraform-providers-hub'
              path: '$(hubWorkspacePath)/.terraform'

          - task: AzureCLI@2
            displayName: 'Terraform Init (Backend Only)'
            inputs:
              azureSubscription: '$(hubServiceConnection)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                Write-Host "Re-initializing backend connection..."
                Set-Location '$(hubWorkspacePath)'
                
                # Get storage account key
                $STORAGE_KEY = az storage account keys list --resource-group $(backendResourceGroupName) --account-name $(backendStorageAccountName) --query '[0].value' -o tsv
                
                # Initialize backend only (providers already downloaded)
                terraform init `
                  -backend-config="resource_group_name=$(backendResourceGroupName)" `
                  -backend-config="storage_account_name=$(backendStorageAccountName)" `
                  -backend-config="container_name=$(backendContainerName)" `
                  -backend-config="key=$(hubBackendKey)" `
                  -backend-config="access_key=$STORAGE_KEY" `
                  -reconfigure
                
                Write-Host "Backend initialized successfully"

          - task: AzureCLI@2
            displayName: 'Check and Release State Lock'
            inputs:
              azureSubscription: '$(hubServiceConnection)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                Write-Host "Checking for state lock in Azure Storage before apply..."
                
                # Get storage account key for authentication
                $STORAGE_KEY = az storage account keys list `
                  --resource-group $(backendResourceGroupName) `
                  --account-name $(backendStorageAccountName) `
                  --query '[0].value' `
                  -o tsv
                
                if (-not $STORAGE_KEY) {
                  Write-Host "##[warning]Could not retrieve storage account key. Skipping lock check."
                  exit 0
                }
                
                # Check if the state file blob has a lease (lock)
                $blobLease = az storage blob show `
                  --account-name $(backendStorageAccountName) `
                  --container-name $(backendContainerName) `
                  --name $(hubBackendKey) `
                  --account-key $STORAGE_KEY `
                  --query 'properties.lease.status' `
                  -o tsv 2>$null
                
                if ($blobLease -eq "locked") {
                  Write-Host "##[warning]State file is locked in Azure Storage"
                  Write-Host "Attempting to break the lease..."
                  
                  az storage blob lease break `
                    --account-name $(backendStorageAccountName) `
                    --container-name $(backendContainerName) `
                    --blob-name $(hubBackendKey) `
                    --account-key $STORAGE_KEY `
                    --lease-break-period 0
                  
                  Write-Host "##[section]State lock lease broken successfully"
                  Start-Sleep -Seconds 2
                } elseif ($blobLease -eq "unlocked") {
                  Write-Host "No state lock detected. Proceeding with apply..."
                } else {
                  Write-Host "State file check completed (file may not exist yet for first deployment)"
                }
            continueOnError: true
            timeoutInMinutes: 1

          - task: AzureCLI@2
            displayName: 'Terraform Apply (Using Pre-approved Plan)'
            inputs:
              azureSubscription: '$(hubServiceConnection)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                Write-Host "Applying pre-approved Terraform plan..."
                Set-Location '$(hubWorkspacePath)'
                
                # Verify plan file exists
                if (-not (Test-Path "tfplan")) {
                  Write-Host "##vso[task.logissue type=error]Plan file not found! Cannot apply."
                  exit 1
                }
                
                Write-Host "Plan file found. Applying changes..."
                
                # Apply the pre-approved plan (no variables needed - they're in the plan)
                terraform apply -input=false -auto-approve tfplan
                
                Write-Host "##[section]Terraform apply completed successfully"

          - task: AzureCLI@2
            displayName: 'Terraform Output'
            inputs:
              azureSubscription: '$(hubServiceConnection)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                Write-Host "Retrieving Terraform outputs..."
                Set-Location '$(hubWorkspacePath)'
                terraform output -json | ConvertFrom-Json | ConvertTo-Json -Depth 10
                Write-Host "Outputs retrieved successfully"
            condition: succeeded()
      inputs:
        azureSubscription: '$(hubServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Hub Connectivity Validation ==="
          
          # Check VNet Peerings
          echo "VNet Peerings:"
          az network vnet list --query "[].{VNet:name, Peerings:peerings[].remoteVnet.id}" --output table
          
          # Check DNS configuration
          echo "Private DNS Zones:"
          az network private-dns zone list --query "[].{Name:name, ResourceGroup:resourceGroup}" --output table
          
          echo "Hub connectivity validation completed"