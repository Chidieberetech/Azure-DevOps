# Sub-TRL-prd-weu-tf.yml
name: Prod Environment Deployment

trigger: none

pr: none

variables:
- group: trl-hubspoke-config
- group: trl-hubspoke-secrets

stages:
- stage: Plan_Prod
  displayName: 'Plan Prod'
  jobs:
  - job: Plan
    displayName: 'Terraform Plan for Prod'
    pool:
      name: TRL-Agents
    steps:
    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: '$(prodServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Initializing Prod workspace for planning..."
          Set-Location '$(prodWorkspacePath)'
          
          # Get storage account key
          $STORAGE_KEY = az storage account keys list --resource-group $(backendResourceGroupName) --account-name $(backendStorageAccountName) --query '[0].value' -o tsv
          
          # Initialize Terraform with backend configuration
          terraform init `
            -backend-config="resource_group_name=$(backendResourceGroupName)" `
            -backend-config="storage_account_name=$(backendStorageAccountName)" `
            -backend-config="container_name=$(backendContainerName)" `
            -backend-config="key=$(prodBackendKey)" `
            -backend-config="access_key=$STORAGE_KEY" `
            -reconfigure
          
          Write-Host "Prod workspace initialized successfully for planning"

    - task: AzureCLI@2
      displayName: 'Terraform Validate'
      inputs:
        azureSubscription: '$(prodServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Validating Terraform configuration..."
          Set-Location '$(prodWorkspacePath)'
          terraform validate
          Write-Host "Terraform configuration validated successfully"

    - task: AzureCLI@2
      displayName: 'Check and Release State Lock'
      inputs:
        azureSubscription: '$(prodServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Checking for state lock in Azure Storage..."
          
          # Get storage account key for authentication
          $STORAGE_KEY = az storage account keys list `
            --resource-group $(backendResourceGroupName) `
            --account-name $(backendStorageAccountName) `
            --query '[0].value' `
            -o tsv
          
          if (-not $STORAGE_KEY) {
            Write-Host "##[warning]Could not retrieve storage account key. Skipping lock check."
            exit 0
          }
          
          # Check if the state file blob has a lease (lock)
          $blobLease = az storage blob show `
            --account-name $(backendStorageAccountName) `
            --container-name $(backendContainerName) `
            --name $(prodBackendKey) `
            --account-key $STORAGE_KEY `
            --query 'properties.lease.status' `
            -o tsv 2>$null
          
          if ($blobLease -eq "locked") {
            Write-Host "##[warning]State file is locked in Azure Storage"
            Write-Host "Attempting to break the lease..."
            
            az storage blob lease break `
              --account-name $(backendStorageAccountName) `
              --container-name $(backendContainerName) `
              --blob-name $(prodBackendKey) `
              --account-key $STORAGE_KEY `
              --lease-break-period 0
            
            Write-Host "##[section]State lock lease broken successfully"
            Start-Sleep -Seconds 2
          } elseif ($blobLease -eq "unlocked") {
            Write-Host "No state lock detected. Proceeding..."
          } else {
            Write-Host "State file not found or unable to check lease status (this is normal for first run)"
          }
      continueOnError: true
      timeoutInMinutes: 1

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: '$(prodServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Creating Terraform plan..."
          Set-Location '$(prodWorkspacePath)'
          
          # Get subscription ID from Azure CLI context
          $SUBSCRIPTION_ID = az account show --query id -o tsv
          Write-Host "Using subscription: $SUBSCRIPTION_ID"
          
          terraform plan `
            -var="sql_admin_password=$(SQL_ADMIN_PASSWORD)" `
            -var="vm_admin_password=$(VM_ADMIN_PASSWORD)" `
            -var="admin_password=$(VM_ADMIN_PASSWORD)" `
            -var="backendResourceGroupName=$(backendResourceGroupName)" `
            -var="backendStorageAccountName=$(backendStorageAccountName)" `
            -var="backendContainerName=$(backendContainerName)" `
            -var="hubBackendKey=$(hubBackendKey)" `
            -var="subscription_id=$SUBSCRIPTION_ID" `
            -out=tfplan
          
          Write-Host "Terraform plan created successfully"

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Terraform Plan'
      inputs:
        pathtoPublish: '$(prodWorkspacePath)/tfplan'
        artifactName: 'terraform-plan-prod'

- stage: Apply_Prod
  displayName: 'Apply Prod (Manual Approval Required)'
  dependsOn: Plan_Prod
  condition: succeeded()
  jobs:
  - deployment: ApplyProduction
    displayName: 'Terraform Apply for Prod'
    environment: 'Production'
    pool:
      name: TRL-Agents
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@0
            displayName: 'Download Terraform Plan'
            inputs:
              artifactName: 'terraform-plan-prod'
              downloadPath: '$(prodWorkspacePath)'

          - task: AzureCLI@2
            displayName: 'Terraform Init'
            inputs:
              azureSubscription: '$(prodServiceConnection)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                Write-Host "Initializing Prod workspace for apply..."
                Set-Location '$(prodWorkspacePath)'
                
                # Get storage account key
                $STORAGE_KEY = az storage account keys list --resource-group $(backendResourceGroupName) --account-name $(backendStorageAccountName) --query '[0].value' -o tsv
                
                # Initialize Terraform with backend configuration
                terraform init `
                  -backend-config="resource_group_name=$(backendResourceGroupName)" `
                  -backend-config="storage_account_name=$(backendStorageAccountName)" `
                  -backend-config="container_name=$(backendContainerName)" `
                  -backend-config="key=$(prodBackendKey)" `
                  -backend-config="access_key=$STORAGE_KEY"
                
                Write-Host "Prod workspace initialized successfully for apply"

          - task: AzureCLI@2
            displayName: 'Check and Release State Lock'
            inputs:
              azureSubscription: '$(prodServiceConnection)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                Write-Host "Checking for state lock in Azure Storage before apply..."
                
                # Get storage account key for authentication
                $STORAGE_KEY = az storage account keys list `
                  --resource-group $(backendResourceGroupName) `
                  --account-name $(backendStorageAccountName) `
                  --query '[0].value' `
                  -o tsv
                
                if (-not $STORAGE_KEY) {
                  Write-Host "##[warning]Could not retrieve storage account key. Skipping lock check."
                  exit 0
                }
                
                # Check if the state file blob has a lease (lock)
                $blobLease = az storage blob show `
                  --account-name $(backendStorageAccountName) `
                  --container-name $(backendContainerName) `
                  --name $(prodBackendKey) `
                  --account-key $STORAGE_KEY `
                  --query 'properties.lease.status' `
                  -o tsv 2>$null
                
                if ($blobLease -eq "locked") {
                  Write-Host "##[warning]State file is locked in Azure Storage"
                  Write-Host "Attempting to break the lease..."
                  
                  az storage blob lease break `
                    --account-name $(backendStorageAccountName) `
                    --container-name $(backendContainerName) `
                    --blob-name $(prodBackendKey) `
                    --account-key $STORAGE_KEY `
                    --lease-break-period 0
                  
                  Write-Host "##[section]State lock lease broken successfully"
                  Start-Sleep -Seconds 2
                } elseif ($blobLease -eq "unlocked") {
                  Write-Host "No state lock detected. Proceeding with apply..."
                } else {
                  Write-Host "State file check completed (file may not exist yet for first deployment)"
                }
            continueOnError: true
            timeoutInMinutes: 1

          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            inputs:
              azureSubscription: '$(prodServiceConnection)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                Write-Host "Applying Terraform plan..."
                Set-Location '$(prodWorkspacePath)'
                
                # Get subscription ID from Azure CLI context
                $SUBSCRIPTION_ID = az account show --query id -o tsv
                Write-Host "Using subscription: $SUBSCRIPTION_ID"
                
                terraform apply `
                  -input=false `
                  -auto-approve `
                  -var="sql_admin_password=$(SQL_ADMIN_PASSWORD)" `
                  -var="vm_admin_password=$(VM_ADMIN_PASSWORD)" `
                  -var="admin_password=$(VM_ADMIN_PASSWORD)" `
                  -var="backendResourceGroupName=$(backendResourceGroupName)" `
                  -var="backendStorageAccountName=$(backendStorageAccountName)" `
                  -var="backendContainerName=$(backendContainerName)" `
                  -var="hubBackendKey=$(hubBackendKey)" `
                  -var="subscription_id=$SUBSCRIPTION_ID"
                
                Write-Host "Terraform apply completed successfully"

          - task: AzureCLI@2
            displayName: 'Terraform Output'
            inputs:
              azureSubscription: '$(prodServiceConnection)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                Write-Host "Retrieving Terraform outputs..."
                Set-Location '$(prodWorkspacePath)'
                terraform output
                Write-Host "Outputs retrieved successfully"
