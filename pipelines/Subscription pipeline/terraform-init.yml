# terraform-init.yml
name: Terraform-Init-$(Date:yyyy-MM-dd)$(Rev:.r)

trigger: none

pr: none

variables:
- group: trl-hubspoke-config
- group: trl-hubspoke-secrets

stages:
- stage: Validate_Backend
  displayName: 'Validate Backend Storage'
  jobs:
  - job: Validate_Storage
    displayName: 'Validate Storage Account Access'
    pool:
      name: TRL-Agents
    steps:
    - task: AzureCLI@2
      displayName: 'Validate Storage Account'
      inputs:
        azureSubscription: '$(hubServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Validating storage account: $(backendStorageAccountName)"
          az storage account show --name $(backendStorageAccountName) --resource-group $(backendResourceGroupName)
          Write-Host "Storage account validation successful"

- stage: Setup_Terraform
  displayName: 'Setup Terraform Environment'
  dependsOn: Validate_Backend
  jobs:
  - job: Setup
    displayName: 'Setup Terraform'
    pool:
      name: TRL-Agents
    steps:
    - powershell: |
        Write-Host "Checking Terraform version..."
        terraform version
        Write-Host "Terraform is available"
      displayName: 'Verify Terraform Installation'

- stage: Init_Workspaces
  displayName: 'Initialize Terraform Workspaces'
  dependsOn: Setup_Terraform
  jobs:
  - job: Init_Hub
    displayName: 'Initialize Hub Workspace'
    pool:
      name: TRL-Agents
    steps:
    - task: AzureCLI@2
      displayName: 'Terraform Init - Hub'
      inputs:
        azureSubscription: '$(hubServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Initializing Hub workspace..."
          Set-Location '$(hubWorkspacePath)'
          
          # Get storage account key
          $STORAGE_KEY = az storage account keys list --resource-group $(backendResourceGroupName) --account-name $(backendStorageAccountName) --query '[0].value' -o tsv
          
          # Initialize Terraform with backend configuration
          terraform init `
            -backend-config="resource_group_name=$(backendResourceGroupName)" `
            -backend-config="storage_account_name=$(backendStorageAccountName)" `
            -backend-config="container_name=$(backendContainerName)" `
            -backend-config="key=$(hubBackendKey)" `
            -backend-config="access_key=$STORAGE_KEY" `
            -reconfigure
          
          Write-Host "Hub workspace initialized successfully"

  - job: Init_Management
    displayName: 'Initialize Management Workspace'
    pool:
      name: TRL-Agents
    steps:
    - task: AzureCLI@2
      displayName: 'Terraform Init - Management'
      inputs:
